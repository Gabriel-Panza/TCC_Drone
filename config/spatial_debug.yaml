drone_offboard_node:
  ros__parameters:
    navigation_mode: spatial_astar
    spatial_execute_path: false
    spatial_depth_source: ground_truth_debug
    ground_truth_depth_topic: /sim_depth_ground_truth
    save_ground_truth_dataset: false
    spatial_save_dataset: true
    spatial_save_frames: true
    spatial_show_topdown: true
    spatial_collect_legacy_metrics: false
    spatial_process_every_n: 10
    spatial_voxel_resolution_m: 0.75
    spatial_depth_stride: 40
    spatial_min_depth_m: 0.5
    spatial_max_depth_m: 30.0
    spatial_obstacle_vertical_band_m: 1.5
    spatial_clearance_radius_m: 1.25
    spatial_known_free_radius_m: 0.8
    spatial_local_plan_radius_m: 25.0
    spatial_min_subgoal_progress_m: 0.5
    spatial_vertical_tolerance_m: 0.5
    spatial_max_waypoint_spacing_m: 5.0
    spatial_connectivity: 26
    spatial_replan_interval_s: 1.5
    spatial_waypoint_acceptance_radius_m: 0.8
    spatial_global_goal_acceptance_radius_m: 1.5
    spatial_takeoff_altitude_m: 1.65
    spatial_takeoff_acceptance_radius_m: 0.2
    # Rota curta de calibracao, antes da primeira arvore. Amplie somente depois
    # que mapa, altitude e atualizacao em tempo real estiverem estaveis.
    spatial_waypoints_relative_m: [-25.0, 25.0, -1.65, -50.0, 70.0, -1.65, -25.0, 25.0, -1.65, 0.0, 0.0, -1.65]
    camera_offset_forward_m: 0.15
    camera_offset_right_m: 0.0
    camera_offset_down_m: -0.22
    camera_mount_roll_deg: 0.0
    camera_mount_pitch_deg: 0.0
    camera_mount_yaw_deg: 0.0
    ground_truth_depth_max_age_s: 0.08
    ground_truth_max_interval_s: 0.50
    use_dt_normalized_control: false

data_logger:
  ros__parameters:
    flight_memmap_capacity: 20000
    flight_memmap_flush_every_n: 40
